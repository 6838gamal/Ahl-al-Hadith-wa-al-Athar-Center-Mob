services:
  - type: web
    name: ahl-al-hadith-center
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 serve.py
    envVars:
      - key: RENDER_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 10000
